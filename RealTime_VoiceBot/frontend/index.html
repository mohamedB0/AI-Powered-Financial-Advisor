<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="noise"></div>
  <div class="grid-bg"></div>

  <main class="container">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-bracket">[</span>
        <span class="logo-text">ARIA</span>
        <span class="logo-bracket">]</span>
      </div>
      <p class="tagline">Real-time AI Voice Assistant</p>
      <div class="status-bar">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Disconnected</span>
      </div>
    </header>

    <!-- Visualiser orb -->
    <section class="orb-section">
      <div class="orb-ring orb-ring--3"></div>
      <div class="orb-ring orb-ring--2"></div>
      <div class="orb-ring orb-ring--1"></div>
      <div class="orb" id="orb">
        <div class="orb-inner">
          <svg class="mic-icon" id="micIcon" viewBox="0 0 24 24" fill="none"
               xmlns="http://www.w3.org/2000/svg">
            <rect x="9" y="2" width="6" height="11" rx="3" fill="currentColor"/>
            <path d="M5 10a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round"/>
            <line x1="12" y1="19" x2="12" y2="22" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round"/>
            <line x1="8" y1="22" x2="16" y2="22" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <svg class="stop-icon hidden" id="stopIcon" viewBox="0 0 24 24"
               fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
          </svg>
        </div>
      </div>
      <p class="orb-hint" id="orbHint">Click to speak</p>
    </section>

    <!-- Transcript + reply panels -->
    <section class="panels">

      <div class="panel panel--you">
        <div class="panel-label">
          <span class="panel-dot panel-dot--you"></span> YOU
        </div>
        <div class="panel-content" id="transcriptPanel">
          <span class="placeholder">Your words appear here…</span>
        </div>
      </div>

      <div class="panel panel--ai">
        <div class="panel-label">
          <span class="panel-dot panel-dot--ai"></span> ARIA
        </div>
        <div class="panel-content" id="replyPanel">
          <span class="placeholder">AI response streams here…</span>
        </div>
      </div>

    </section>

    <!-- Log / history -->
    <section class="history" id="history">
      <div class="history-header">
        <span>SESSION LOG</span>
        <button class="clear-btn" id="clearBtn">CLEAR</button>
      </div>
      <div class="history-body" id="historyBody">
        <p class="placeholder">Conversation will appear here.</p>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
