<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Financial Advisor</title>
    <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Icons and Plotly -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>

    <!-- Tailwind CSS CDN with Typography Plugin for beautiful LLM Markdown -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        head: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            bg: '#eef2ee',
                            text: '#2d4a36',
                        },
                        ui: {
                            base: '#ffffff',
                            sidebar: '#ffffff',
                            border: '#e5e7eb',
                            text: '#111827',
                            muted: '#6b7280',
                            input: '#f9fafb'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Fallback/Extra custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .sidebar-icon {
            color: #4b5563;
        }
    </style>
</head>

<body
    class="bg-ui-base text-ui-text font-sans h-screen overflow-hidden selection:bg-brand-bg selection:text-brand-text">

    <!-- Main application container -->
    <div class="flex h-full w-full bg-ui-base overflow-hidden">

        <!-- Ultra-thin Sidebar -->
        <aside
            class="w-[72px] flex-shrink-0 bg-[#1a2e1f] border-r border-[#243b28] flex flex-col items-center py-6 relative z-10 h-full">
            <nav class="flex-grow flex flex-col gap-4 mt-8 w-full items-center">

                <a href="/chat"
                    class="flex items-center justify-center w-11 h-11 rounded-lg transition-all duration-200 hover:bg-white/10 group {% if active_page == 'chat' %}bg-white/10 relative{% endif %}"
                    title="Chat">
                    <i
                        class="fa-regular fa-message text-[1.1rem] transition-colors {% if active_page == 'chat' %}text-emerald-400{% else %}text-white/60 group-hover:text-white{% endif %}"></i>
                </a>

                <a href="/pipeline"
                    class="flex items-center justify-center w-11 h-11 rounded-lg transition-all duration-200 hover:bg-white/10 group {% if active_page == 'pipeline' %}bg-white/10 relative{% endif %}"
                    title="My Uploads">
                    <i
                        class="fa-solid fa-cloud-arrow-up text-[1.1rem] transition-colors {% if active_page == 'pipeline' %}text-emerald-400{% else %}text-white/60 group-hover:text-white{% endif %}"></i>
                </a>
            </nav>

            <!-- Bottom icons -->
            <div class="flex flex-col gap-3 items-center pb-2">
                <button id="settings-btn" class="w-11 h-11 rounded-lg text-white/50 hover:bg-white/10 hover:text-white transition-colors">
                    <i class="fa-solid fa-gear text-[1.1rem]"></i>
                </button>

                <!-- User avatar + popover -->
                <div id="auth-status" class="relative">
                    <button id="user-avatar-btn" onclick="toggleUserMenu()"
                        class="w-10 h-10 rounded-full bg-gradient-to-br from-emerald-500 to-emerald-700 shadow-lg border-2 border-emerald-400/40 flex items-center justify-center cursor-pointer hover:scale-110 hover:border-emerald-300 transition-all duration-200"
                        title="Account">
                        <span id="user-initials" class="text-white font-bold text-[13px] leading-none select-none"></span>
                    </button>

                    <!-- Popover menu — positioned to the RIGHT of the sidebar -->
                    <div id="user-menu" class="hidden absolute bottom-0 left-[calc(100%+12px)] w-56 bg-white rounded-xl shadow-2xl border border-gray-100 overflow-hidden z-50">
                        <div class="px-4 py-3 border-b border-gray-100 bg-gray-50/50">
                            <p id="menu-user-name" class="text-[13px] font-semibold text-gray-800 truncate"></p>
                            <p id="menu-user-email" class="text-[11px] text-gray-400 truncate"></p>
                        </div>
                        <div class="py-1.5">
                            <button onclick="showLoginModal(); toggleUserMenu();"
                                id="menu-login-btn"
                                class="w-full text-left px-4 py-2 text-[13px] text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors flex items-center gap-2.5"
                                style="display:none;">
                                <i class="fa-solid fa-right-to-bracket text-[11px] text-gray-400 w-4 text-center"></i> Se connecter
                            </button>
                            <button onclick="logout()"
                                id="menu-logout-btn"
                                class="w-full text-left px-4 py-2 text-[13px] text-red-600 hover:bg-red-50 hover:text-red-700 transition-colors flex items-center gap-2.5"
                                style="display:none;">
                                <i class="fa-solid fa-right-from-bracket text-[11px] w-4 text-center"></i> Déconnexion
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-grow relative overflow-y-auto w-full h-full flex flex-col bg-white">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/40 backdrop-blur-sm transition-opacity">
        <div class="bg-white m-4 rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform scale-95 transition-transform duration-200" id="settings-modal-content">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h3 class="font-semibold text-gray-800"><i class="fa-solid fa-sliders text-brand-text mr-2"></i> Advisor Settings</h3>
                <button id="close-settings" class="text-gray-400 hover:text-gray-600 transition-colors"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div class="p-6 space-y-6">
                <!-- Persona -->
                <div>
                    <label class="block text-[13px] font-medium text-gray-700 mb-1.5">Investment Persona</label>
                    <select id="setting-persona" class="w-full text-sm rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 outline-none focus:border-brand-text focus:ring-1 focus:ring-brand-text transition-all">
                        <option value="Balanced">Balanced (Neutral & Objective)</option>
                        <option value="Prudent">Prudent (Highly Risk-Averse)</option>
                        <option value="Aggressive">Aggressive (Focus on Growth/Risk)</option>
                    </select>
                </div>
                
                <!-- RAG Depth -->
                <div>
                    <label class="block text-[13px] font-medium text-gray-700 mb-1.5 flex justify-between">
                        <span>Research Depth (Passages)</span>
                        <span id="depth-val" class="text-brand-text font-bold">3</span>
                    </label>
                    <input type="range" id="setting-depth" min="1" max="10" value="3" class="w-full accent-brand-text">
                    <p class="text-[11px] text-gray-400 mt-1">Lower = Faster & prevents Token limit crashes.</p>
                </div>
            </div>
            
            <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-3">
                <button id="cancel-settings" class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-gray-800 transition-colors">Cancel</button>
                <button id="save-settings" class="px-5 py-2 text-sm font-medium text-white bg-brand-text rounded-lg shadow-sm hover:bg-[#203a27] transition-colors"><i class="fa-solid fa-check mr-1.5"></i> Save & Apply</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
