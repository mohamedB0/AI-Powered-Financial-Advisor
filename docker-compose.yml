# ════════════════════════════════════════════════════════════════════════════════
#  AI Financial Advisor — Production Docker Compose
#  Run:  docker-compose up -d --build
#  Stop: docker-compose down
# ════════════════════════════════════════════════════════════════════════════════

services:

  # ─── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: fin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_advisor}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fin_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Application Services ──────────────────────────────────────────────────

  # FastAPI Backend (Production: Uvicorn with multiple workers)
  api:
    build: .
    container_name: fin_api
    restart: unless-stopped
    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --timeout-keep-alive 120
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@postgres:5432/${POSTGRES_DB:-financial_advisor}
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - API_BASE_URL=http://api:8000
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
      - hf_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Flask UI (Production: Waitress WSGI server)
  ui:
    build: .
    container_name: fin_ui
    restart: unless-stopped
    command: >
      waitress-serve
      --host 0.0.0.0
      --port 5000
      --threads 4
      ui.app:app
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api

    # (Removed Celery Worker and Beat per request so they can be run on the host terminal)

  # Flower (Celery monitoring dashboard on port 5555)
  flower:
    build: .
    container_name: fin_flower
    restart: unless-stopped
    command: >
      celery -A tasks.celery_app:celery_app flower
      --port=5555
      --broker_api=redis://redis:6379/0
    ports:
      - "5555:5555"
    env_file: .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy

# ─── Persistent Volumes ─────────────────────────────────────────────────────

volumes:
  postgres_data:
  hf_cache:      # HuggingFace model cache — BGE-M3 downloaded once, reused across restarts
