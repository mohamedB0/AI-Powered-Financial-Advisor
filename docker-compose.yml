# ════════════════════════════════════════════════════════════════════════════════
#  AI Financial Advisor — Production Docker Compose
#  Run:  docker-compose up -d --build
#  Stop: docker-compose down
# ════════════════════════════════════════════════════════════════════════════════

services:

  # ─── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: fin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_advisor}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: fin_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Observability ──────────────────────────────────────────────────────────

  # Arize Phoenix — LLM tracing & observability UI
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: fin_phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"
    environment:
      - PHOENIX_WORKING_DIR=/data
    volumes:
      - phoenix_data:/data

  # ─── Application Services ──────────────────────────────────────────────────

  # FastAPI Backend (Production: Uvicorn)
  api:
    build: .
    container_name: fin_api
    restart: unless-stopped
    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
      --workers 1
      --timeout-keep-alive 120
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - ENVIRONMENT=production
      - REDIS_HOST=redis
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@postgres:5432/${POSTGRES_DB:-financial_advisor}}
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - API_BASE_URL=http://api:8000
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
      - hf_cache:/app/.hf_cache
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      phoenix:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 6G

  # Flask UI (Production: Waitress WSGI server)
  ui:
    build: .
    container_name: fin_ui
    restart: unless-stopped
    command: >
      waitress-serve
      --host 0.0.0.0
      --port 5000
      --threads 4
      ui.app:app
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Celery Workers ─────────────────────────────────────────────────────────

  # User upload ingestion worker (high priority, single-threaded)
  celery-user-worker:
    build: .
    container_name: fin_celery_user
    restart: unless-stopped
    command: >
      celery -A tasks.celery_app:celery_app worker
      --loglevel=info
      -Q user_ingestion
      -c 1
      --pool=solo
      -n user_worker@%h
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@postgres:5432/${POSTGRES_DB:-financial_advisor}}
      - CHROMA_PERSIST_DIR=/app/chroma_db
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
      - hf_cache:/app/.hf_cache
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G

  # Background worker (scraping, data fetch, local ingestion — normal priority)
  celery-background-worker:
    build: .
    container_name: fin_celery_bg
    restart: unless-stopped
    command: >
      celery -A tasks.celery_app:celery_app worker
      --loglevel=info
      -Q scraping,data_fetch,ingestion,local_ingestion,default
      -c 2
      --pool=solo
      -n bg_worker@%h
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@postgres:5432/${POSTGRES_DB:-financial_advisor}}
      - CHROMA_PERSIST_DIR=/app/chroma_db
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
      - hf_cache:/app/.hf_cache
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G

  # Celery Beat (periodic task scheduler)
  celery-beat:
    build: .
    container_name: fin_celery_beat
    restart: unless-stopped
    command: >
      celery -A tasks.celery_app:celery_app beat
      --loglevel=info
    env_file: .env
    environment:
      - REDIS_HOST=redis
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy

  # Flower (Celery monitoring dashboard) — protected with basic auth
  flower:
    build: .
    container_name: fin_flower
    restart: unless-stopped
    command: >
      celery -A tasks.celery_app:celery_app flower
      --port=5555
      --broker_api=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      --basic-auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-changeme}
    ports:
      - "5555:5555"
    env_file: .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

# ─── Persistent Volumes ─────────────────────────────────────────────────────

volumes:
  postgres_data:
  hf_cache:        # HuggingFace model cache — BGE-M3 downloaded once, reused across restarts
  phoenix_data:    # Phoenix trace storage — persists across container restarts
