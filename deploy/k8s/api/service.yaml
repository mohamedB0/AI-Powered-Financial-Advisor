# API ClusterIP Service — reachable inside the cluster as "api:8000"
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: financial-advisor
  labels:
    app.kubernetes.io/name: financial-advisor
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
