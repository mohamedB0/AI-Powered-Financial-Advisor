# PostgreSQL ClusterIP Service — reachable inside the cluster as "postgres:5432"
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: financial-advisor
  labels:
    app.kubernetes.io/name: financial-advisor
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
