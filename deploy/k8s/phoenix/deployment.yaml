# Arize Phoenix — LLM observability and tracing backend
# Stores traces in the phoenix-data PVC under /data
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: financial-advisor
  labels:
    app.kubernetes.io/name: financial-advisor
    app.kubernetes.io/component: phoenix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix
  template:
    metadata:
      labels:
        app: phoenix
        app.kubernetes.io/name: financial-advisor
        app.kubernetes.io/component: phoenix
    spec:
      containers:
        - name: phoenix
          image: arizephoenix/phoenix:latest
          ports:
            - containerPort: 6006
              name: http
          env:
            - name: PHOENIX_WORKING_DIR
              value: "/data"
          volumeMounts:
            - name: phoenix-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: 6006
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 6006
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: phoenix-data
          persistentVolumeClaim:
            claimName: phoenix-data
