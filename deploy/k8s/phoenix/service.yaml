# Phoenix ClusterIP Service — reachable inside the cluster as "phoenix:6006"
apiVersion: v1
kind: Service
metadata:
  name: phoenix
  namespace: financial-advisor
  labels:
    app.kubernetes.io/name: financial-advisor
    app.kubernetes.io/component: phoenix
spec:
  type: ClusterIP
  selector:
    app: phoenix
  ports:
    - name: http
      port: 6006
      targetPort: 6006
      protocol: TCP
