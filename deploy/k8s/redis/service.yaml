# Redis ClusterIP Service — reachable inside the cluster as "redis:6379"
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: financial-advisor
  labels:
    app.kubernetes.io/name: financial-advisor
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
