# Celery Beat â€” periodic task scheduler
# IMPORTANT: replicas MUST stay at 1. Running multiple beat instances causes
# duplicate scheduled task executions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: financial-advisor
  labels:
    app.kubernetes.io/name: financial-advisor
    app.kubernetes.io/component: celery-beat
  annotations:
    # Operational safety guard â€” do NOT increase replicas
    note: "celery-beat-must-stay-at-1-replica"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
        app.kubernetes.io/name: financial-advisor
        app.kubernetes.io/component: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: financial-advisor:latest
          imagePullPolicy: Never  # Local image â€” minikube / kind
          command:
            - celery
            - -A
            - tasks.celery_app:celery_app
            - beat
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          # Beat only needs log persistence; no model or data access required
          volumeMounts:
            - name: app-logs
              mountPath: /app/logs
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: app-logs
          persistentVolumeClaim:
            claimName: app-logs
