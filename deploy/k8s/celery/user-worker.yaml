# Celery User-Ingestion Worker
# Processes the "user_ingestion" queue with concurrency=1 and pool=solo
# (solo pool avoids multiprocessing issues in containers).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-user-worker
  namespace: financial-advisor
  labels:
    app.kubernetes.io/name: financial-advisor
    app.kubernetes.io/component: celery-user-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-user-worker
  template:
    metadata:
      labels:
        app: celery-user-worker
        app.kubernetes.io/name: financial-advisor
        app.kubernetes.io/component: celery-user-worker
    spec:
      containers:
        - name: celery-user-worker
          image: financial-advisor:latest
          imagePullPolicy: Never  # Local image — minikube / kind
          command:
            - celery
            - -A
            - tasks.celery_app:celery_app
            - worker
            - --loglevel=info
            - -Q
            - user_ingestion
            - -c
            - "1"
            - --pool=solo
            - -n
            - user_worker@%h
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          volumeMounts:
            - name: chroma-db
              mountPath: /app/chroma_db
            - name: app-data
              mountPath: /app/data
            - name: app-logs
              mountPath: /app/logs
            - name: hf-cache
              mountPath: /app/.hf_cache
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
      volumes:
        - name: chroma-db
          persistentVolumeClaim:
            claimName: chroma-db
        - name: app-data
          persistentVolumeClaim:
            claimName: app-data
        - name: app-logs
          persistentVolumeClaim:
            claimName: app-logs
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache
